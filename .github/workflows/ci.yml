name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changed.outputs.mode }}
      should_run: ${{ steps.changed.outputs.should_run }}
      packages: ${{ steps.changed.outputs.packages }}
      images: ${{ steps.changed.outputs.images }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: changed
        run: |
          node scripts/changed-targets.mjs \
            --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

  test-build:
    if: needs.detect-changes.outputs.should_run == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: https://sqs.ap-northeast-1.amazonaws.com/000000000000/access-events
      VALKEY_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @repo/db migrate:deploy

      - run: node scripts/workspace-check.mjs --packages "${{ needs.detect-changes.outputs.packages }}"

  docker-build:
    if: needs.detect-changes.outputs.images != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev')
    needs: [detect-changes, test-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - run: node scripts/workspace-build-image.mjs --images "${{ needs.detect-changes.outputs.images }}"

  docker-push:
    if: needs.detect-changes.outputs.images != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != '' && vars.AWS_ROLE_TO_ASSUME != ''
    needs: [detect-changes, test-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - run: IMAGE_PREFIX="$ECR_REGISTRY" IMAGE_TAG="${{ github.sha }}" node scripts/workspace-build-image.mjs --images "${{ needs.detect-changes.outputs.images }}" --additional-tags latest --push
