name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changed.outputs.mode }}
      should_run: ${{ steps.changed.outputs.should_run }}
      packages: ${{ steps.changed.outputs.packages }}
      images: ${{ steps.changed.outputs.images }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: changed
        run: |
          node scripts/changed-targets.mjs \
            --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Print detected targets
        run: |
          echo "mode=${{ steps.changed.outputs.mode }}"
          echo "should_run=${{ steps.changed.outputs.should_run }}"
          echo "packages=${{ steps.changed.outputs.packages }}"
          echo "images=${{ steps.changed.outputs.images }}"
          echo '${{ steps.changed.outputs.json }}'

  test-build:
    if: needs.detect-changes.outputs.should_run == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379

      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: ap-northeast-1
        ports:
          - 4566:4566

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localhost:4566
      SQS_QUEUE_URL: http://localhost:4566/000000000000/access-events
      VALKEY_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - id: install
        run: pnpm install --frozen-lockfile

      - name: Wait for LocalStack
        id: wait_localstack
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "LocalStack did not become ready in time" >&2
          exit 1

      - name: Create SQS queue
        id: create_sqs
        run: |
          aws --endpoint-url http://localhost:4566 sqs create-queue \
            --region ap-northeast-1 \
            --queue-name access-events

      - id: db_migrate
        run: pnpm --filter @repo/db migrate:deploy

      - name: Run package tests and publish test report
        id: test_report
        run: node scripts/workspace-test-report.mjs --packages "${{ needs.detect-changes.outputs.packages }}"

      - name: Run workspace build checks
        id: workspace_check
        run: node scripts/workspace-check.mjs --skip-tests --packages "${{ needs.detect-changes.outputs.packages }}"

      - name: Publish rendered GitHub Actions summary
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.conclusion }}
          LOCALSTACK_RESULT: ${{ steps.wait_localstack.conclusion }}
          SQS_RESULT: ${{ steps.create_sqs.conclusion }}
          DB_MIGRATE_RESULT: ${{ steps.db_migrate.conclusion }}
          TEST_REPORT_RESULT: ${{ steps.test_report.conclusion }}
          WORKSPACE_CHECK_RESULT: ${{ steps.workspace_check.conclusion }}
          CHANGED_PACKAGES: ${{ needs.detect-changes.outputs.packages }}
        run: |
          status_label() {
            case "$1" in
              success) echo "✅ Success" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "⚪ Not run" ;;
            esac
          }

          add_row() {
            echo "| $1 | $(status_label "$2") |"
          }

          {
            echo "## CI test-build summary"
            echo ""
            echo "Rendered by GitHub Actions Job Summary as a table, so results are visible in the run UI without opening logs."
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            add_row "Install dependencies" "$INSTALL_RESULT"
            add_row "LocalStack readiness" "$LOCALSTACK_RESULT"
            add_row "Create SQS queue" "$SQS_RESULT"
            add_row "DB migration" "$DB_MIGRATE_RESULT"
            add_row "Package tests" "$TEST_REPORT_RESULT"
            add_row "Workspace build checks" "$WORKSPACE_CHECK_RESULT"
            echo ""
            echo "**Changed packages:** \`${CHANGED_PACKAGES:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    if: needs.detect-changes.outputs.images != '' && github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main')
    needs: [detect-changes, test-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Build Docker images
        run: |
          node scripts/workspace-build-image.mjs \
            --images "${{ needs.detect-changes.outputs.images }}"

  docker-push:
    if: needs.detect-changes.outputs.images != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != '' && vars.AWS_ROLE_TO_ASSUME != ''
    needs: [detect-changes, test-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        run: |
          IMAGE_PREFIX="$ECR_REGISTRY/$ECR_NAMESPACE" \
          IMAGE_TAG="${{ github.sha }}" \
          node scripts/workspace-build-image.mjs \
            --images "${{ needs.detect-changes.outputs.images }}" \
            --additional-tags latest \
            --push

      - name: Show pushed image tags
        run: |
          {
            echo "## Pushed image tags"
            echo ""
            echo "Image tag: \`${{ github.sha }}\`"
            echo ""
            echo "Images:"
            echo "\`${{ needs.detect-changes.outputs.images }}\`"
            echo ""
            echo "Use this tag for release-test or selective deploy-test:"
            echo ""
            echo "\`\`\`"
            echo "${{ github.sha }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
