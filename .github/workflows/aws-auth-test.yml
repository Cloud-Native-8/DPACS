name: aws-auth-test

on:
  push:
    branches: [aws-auth-test-workflow]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Validate repository variables
        run: |
          echo "vars.AWS_REGION='${{ vars.AWS_REGION }}'"
          echo "vars.AWS_ROLE_TO_ASSUME='${{ vars.AWS_ROLE_TO_ASSUME }}'"
          test -n "${{ vars.AWS_REGION }}" || { echo "vars.AWS_REGION is empty"; exit 1; }
          test -n "${{ vars.AWS_ROLE_TO_ASSUME }}" || { echo "vars.AWS_ROLE_TO_ASSUME is empty"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
