name: release-build-test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE }}

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379

      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: ap-northeast-1
        ports:
          - 4566:4566

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localhost:4566
      SQS_QUEUE_URL: http://localhost:4566/000000000000/access-events
      VALKEY_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Wait for LocalStack
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "LocalStack did not become ready in time" >&2
          exit 1

      - name: Create SQS queue
        run: |
          aws --endpoint-url http://localhost:4566 sqs create-queue \
            --region ap-northeast-1 \
            --queue-name access-events

      - run: pnpm --filter @repo/db migrate:deploy

      - run: node scripts/workspace-check.mjs --packages "@repo/access,@repo/report,@repo/worker,@repo/db,@repo/queue"

  build-push-deploy:
    needs: test-build
    runs-on: ubuntu-latest
    concurrency:
      group: release-build-test
      cancel-in-progress: false
    permissions:
      id-token: write

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push release images
        run: |
          IMAGE_PREFIX="$ECR_REGISTRY/$ECR_NAMESPACE" \
          IMAGE_TAG="$IMAGE_TAG" \
          node scripts/workspace-build-image.mjs \
            --images "access,worker,report,db-migrate" \
            --additional-tags latest \
            --push

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Apply base manifests
        run: |
          kubectl apply -f deploy/k8s/test/00-namespace.yaml
          kubectl apply -f deploy/k8s/test/01-configmap.yaml
          kubectl apply -f deploy/k8s/test/03-serviceaccounts.yaml

      - name: Run database migration
        run: |
          set -euo pipefail

          kubectl -n test delete job db-migrate --ignore-not-found

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/db-migrate:latest|$ECR_REGISTRY/$ECR_NAMESPACE/db-migrate:$IMAGE_TAG|g" \
            deploy/k8s/test/05-migrate-job.yaml \
            | kubectl apply -f -

          kubectl -n test wait \
            --for=condition=complete job/db-migrate \
            --timeout=180s

          kubectl -n test logs job/db-migrate

      - name: Apply application manifests with selected image tag
        run: |
          set -euo pipefail

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/access:latest|$ECR_REGISTRY/$ECR_NAMESPACE/access:$IMAGE_TAG|g" \
            deploy/k8s/test/04-access.yaml \
            | kubectl apply -f -

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/worker:latest|$ECR_REGISTRY/$ECR_NAMESPACE/worker:$IMAGE_TAG|g" \
            deploy/k8s/test/06-worker.yaml \
            | kubectl apply -f -

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/report:latest|$ECR_REGISTRY/$ECR_NAMESPACE/report:$IMAGE_TAG|g" \
            deploy/k8s/test/07-report.yaml \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n test rollout status deployment/access --timeout=180s
          kubectl -n test rollout status deployment/worker --timeout=180s
          kubectl -n test rollout status deployment/report --timeout=180s

      - name: Show deployed images
        run: |
          kubectl -n test get deployment access worker report \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image

      - name: Show final status
        run: kubectl -n test get all

      - name: Show release tag
        run: |
          {
            echo "## release-build-test"
            echo ""
            echo "Deployed image tag:"
            echo ""
            echo "\`\`\`"
            echo "$IMAGE_TAG"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
