name: release-test

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Release image tag to deploy for access, worker, report, and db-migrate"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE }}
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  release-test:
    runs-on: ubuntu-latest
    concurrency:
      group: release-test
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Verify release images exist in ECR
        run: |
          set -euo pipefail

          for image in access worker report db-migrate; do
            echo "Checking $ECR_NAMESPACE/$image:$IMAGE_TAG"

            aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$ECR_NAMESPACE/$image" \
              --image-ids imageTag="$IMAGE_TAG" \
              > /dev/null

            echo "Found $ECR_NAMESPACE/$image:$IMAGE_TAG"
          done

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Apply base manifests
        run: |
          kubectl apply -f deploy/k8s/test/00-namespace.yaml
          kubectl apply -f deploy/k8s/test/01-configmap.yaml
          kubectl apply -f deploy/k8s/test/03-serviceaccounts.yaml

      - name: Run database migration
        run: |
          set -euo pipefail

          kubectl -n test delete job db-migrate --ignore-not-found

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/db-migrate:<tag>|$ECR_REGISTRY/$ECR_NAMESPACE/db-migrate:$IMAGE_TAG|g" \
            deploy/k8s/test/05-migrate-job.yaml \
            | kubectl apply -f -

          kubectl -n test wait \
            --for=condition=complete job/db-migrate \
            --timeout=180s

          kubectl -n test logs job/db-migrate

      - name: Apply application manifests with selected image tag
        run: |
          set -euo pipefail

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/access:<tag>|$ECR_REGISTRY/$ECR_NAMESPACE/access:$IMAGE_TAG|g" \
            deploy/k8s/test/04-access.yaml \
            | kubectl apply -f -

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/worker:<tag>|$ECR_REGISTRY/$ECR_NAMESPACE/worker:$IMAGE_TAG|g" \
            deploy/k8s/test/06-worker.yaml \
            | kubectl apply -f -

          sed \
            "s|$ECR_REGISTRY/$ECR_NAMESPACE/report:<tag>|$ECR_REGISTRY/$ECR_NAMESPACE/report:$IMAGE_TAG|g" \
            deploy/k8s/test/07-report.yaml \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n test rollout status deployment/access --timeout=180s
          kubectl -n test rollout status deployment/worker --timeout=180s
          kubectl -n test rollout status deployment/report --timeout=180s

      - name: Show deployed images
        run: |
          kubectl -n test get deployment access worker report \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image

      - name: Show final status
        run: kubectl -n test get all
