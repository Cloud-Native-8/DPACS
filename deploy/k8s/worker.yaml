apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/worker-pod-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: <account-id>.dkr.ecr.ap-northeast-1.amazonaws.com/worker:latest
          env:
            - name: NODE_ENV
              value: production
            - name: DB_POOL_MAX
              value: "5"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AWS_REGION
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SQS_QUEUE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: worker-env
                  key: DATABASE_URL
