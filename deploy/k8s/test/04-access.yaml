apiVersion: apps/v1
kind: Deployment
metadata:
  name: access
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: access
  template:
    metadata:
      labels:
        app: access
    spec:
      serviceAccountName: access
      containers:
        - name: access
          image: 390402574827.dkr.ecr.ap-northeast-1.amazonaws.com/dpacs/access:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production

            - name: ACCESS_PORT
              value: "4000"

            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AWS_REGION

            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SQS_QUEUE_URL

            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: access-env
                  key: VALKEY_URL
---
apiVersion: v1
kind: Service
metadata:
  name: access
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: access
  ports:
    - name: http
      port: 80
      targetPort: 4000
