apiVersion: apps/v1
kind: Deployment
metadata:
  name: report
  namespace: test
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report
  template:
    metadata:
      labels:
        app: report
    spec:
      automountServiceAccountToken: false
      containers:
        - name: report
          image: 390402574827.dkr.ecr.ap-northeast-1.amazonaws.com/dpacs/report:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production

            - name: HOSTNAME
              value: "0.0.0.0"

            - name: PORT
              value: "3000"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: report-env
                  key: DATABASE_URL

            - name: DB_CONNECTION_TIMEOUT_MS
              value: "30000"

            - name: DB_IDLE_TIMEOUT_MS
              value: "30000"

            - name: DB_POOL_MAX
              value: "5"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: report-env
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: report
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: report
  ports:
    - name: http
      port: 80
      targetPort: 3000
