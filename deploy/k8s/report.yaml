apiVersion: apps/v1
kind: Deployment
metadata:
  name: report
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report
  template:
    metadata:
      labels:
        app: report
    spec:
      automountServiceAccountToken: false
      containers:
        - name: report
          image: <account-id>.dkr.ecr.ap-northeast-1.amazonaws.com/report:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DB_POOL_MAX
              value: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: report-env
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: report
  namespace: app
spec:
  type: LoadBalancer
  selector:
    app: report
  ports:
    - port: 80
      targetPort: 3000
