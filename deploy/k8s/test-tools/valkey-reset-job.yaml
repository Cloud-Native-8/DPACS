apiVersion: batch/v1
kind: Job
metadata:
  name: valkey-flush
  namespace: test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: valkey-flush
          image: valkey/valkey:9.0.3-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: access-env
                  key: VALKEY_URL
          command:
            - sh
            - -c
          args:
            - |
              valkey-cli -u "$VALKEY_URL" FLUSHALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
