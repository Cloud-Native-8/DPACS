apiVersion: v1
kind: ServiceAccount
metadata:
  name: access
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/access-pod-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: access
  template:
    metadata:
      labels:
        app: access
    spec:
      serviceAccountName: access
      containers:
        - name: access
          image: <account-id>.dkr.ecr.ap-northeast-1.amazonaws.com/access:latest
          ports:
            - containerPort: 4000
          env:
            - name: ACCESS_PORT
              value: "4000"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AWS_REGION
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SQS_QUEUE_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: access-env
                  key: VALKEY_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: access
  namespace: app
spec:
  type: LoadBalancer
  selector:
    app: access
  ports:
    - port: 80
      targetPort: 4000
