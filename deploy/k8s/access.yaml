apiVersion: v1
kind: ServiceAccount
metadata:
  name: access
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/access-pod-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access
  namespace: app
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access
  namespace: app
subjects:
  - kind: ServiceAccount
    name: access
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: access
  template:
    metadata:
      labels:
        app: access
    spec:
      serviceAccountName: access
      containers:
        - name: access
          image: <account-id>.dkr.ecr.ap-northeast-1.amazonaws.com/access:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: ACCESS_PORT
              value: "4000"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AWS_REGION
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SQS_QUEUE_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: access-env
                  key: VALKEY_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: access
  namespace: app
spec:
  type: LoadBalancer
  selector:
    app: access
  ports:
    - port: 80
      targetPort: 4000
