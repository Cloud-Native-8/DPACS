apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: app
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: <account-id>.dkr.ecr.ap-northeast-1.amazonaws.com/db-migrate:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migrator-env
                  key: DATABASE_URL
