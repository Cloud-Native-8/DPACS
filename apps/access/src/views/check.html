<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access Check</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #112031;
      }

      main {
        max-width: 720px;
        margin: 40px auto;
        padding: 24px;
      }

      .card {
        background: #fff;
        border: 1px solid #d8e1eb;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(17, 32, 49, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
      }

      input,
      select,
      button {
        padding: 10px 12px;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: #112031;
        color: #fff;
        cursor: pointer;
      }

      pre {
        margin: 16px 0 0;
        padding: 16px;
        overflow: auto;
        background: #0f172a;
        color: #d7e3f4;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Access Check Playground</h1>
        <form id="check-form">
          <label>
            Employee ID
            <input name="employee_id" value="1" required />
          </label>
          <label>
            Access Point ID
            <select name="access_point_id" required>
              <option value="1" data-site-id="1">Hsinchu Fab 12 - Main Gate</option>
              <option value="2" data-site-id="1">Hsinchu Fab 12 - Office Entrance</option>
              <option value="3" data-site-id="2">Taichung Fab 15 - Clean Room Entrance</option>
              <option value="4" data-site-id="2">Taichung Fab 15 - Warehouse Gate</option>
              <option value="5" data-site-id="3">Tainan Fab 18 - Visitor Entrance</option>
              <option value="6" data-site-id="3">Tainan Fab 18 - Control Room Door</option>
            </select>
          </label>
          <label>
            Site ID
            <select name="site_id" required>
              <option value="1">Hsinchu Fab 12</option>
              <option value="2">Taichung Fab 15</option>
              <option value="3">Tainan Fab 18</option>
            </select>
          </label>
          <label>
            Direction
            <select name="direction">
              <option value="in">ENTER</option>
              <option value="out">EXIT</option>
            </select>
          </label>
          <button type="submit">POST /check</button>
        </form>
        <pre id="result">Submit to test /check</pre>
      </section>
    </main>
    <script>
      const form = document.getElementById("check-form");
      const result = document.getElementById("result");

      const ACCESS_BASE_PATH =
        window.location.pathname === "/access" ||
        window.location.pathname.startsWith("/access/")
          ? "/access"
          : "";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const payload = {
          employee_id: formData.get("employee_id"),
          access_point_id: formData.get("access_point_id"),
          site_id: formData.get("site_id"),
          direction: formData.get("direction")
        };

        result.textContent = "Loading...";

        try {
          const response = await fetch(`${ACCESS_BASE_PATH}/check`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const json = await response.json();
          result.textContent = JSON.stringify(json, null, 2);
        } catch (error) {
          result.textContent = error.message;
        }
      });

      // 選accesspoint只顯示哪個廠的accesspointint
      const siteSelect = form.elements.site_id;
      const accessPointSelect = form.elements.access_point_id;

      function syncAccessPoints() {
        const selectedSiteId = siteSelect.value;
        const options = Array.from(accessPointSelect.options);

        for (const option of options) {
          option.hidden = option.dataset.siteId !== selectedSiteId;
        }

        const currentOption = accessPointSelect.selectedOptions[0];
        if (!currentOption || currentOption.hidden) {
          const firstVisible = options.find((option) => !option.hidden);
          if (firstVisible) {
            accessPointSelect.value = firstVisible.value;
          }
        }
      }

      siteSelect.addEventListener("change", syncAccessPoints);
      syncAccessPoints();
    </script>
  </body>
</html>
