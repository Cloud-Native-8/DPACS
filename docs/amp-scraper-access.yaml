global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: dpacs-access
    kubernetes_sd_configs:
      - role: endpoints

    relabel_configs:
      - action: keep
        source_labels:
          - __meta_kubernetes_namespace
        regex: test

      - action: keep
        source_labels:
          - __meta_kubernetes_service_name
        regex: access

      - action: keep
        source_labels:
          - __meta_kubernetes_service_annotation_prometheus_io_scrape
        regex: "true"

      - action: replace
        source_labels:
          - __meta_kubernetes_service_annotation_prometheus_io_path
        target_label: __metrics_path__
        regex: (.+)

      - action: replace
        source_labels:
          - __address__
          - __meta_kubernetes_service_annotation_prometheus_io_port
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

      - action: replace
        source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace

      - action: replace
        source_labels:
          - __meta_kubernetes_service_name
        target_label: service

      - action: replace
        source_labels:
          - __meta_kubernetes_pod_name
        target_label: pod

    metric_relabel_configs:
      - action: keep
        source_labels:
          - __name__
        regex: "up|dpacs_access_.*"
